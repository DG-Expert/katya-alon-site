    en: Katya Alon | Marketing Consultant and Business Marketing Strategy
    ru: Катя Алон | Маркетинговый консультант и стратегия для бизнеса
  description:
    he: קטיה אלון, יועצת שיווקית עם 20 שנות ניסיון. ייעוץ ואסטרטגיה שיווקית, ניהול סושיאל, פרסום ממומן והדרכות לשיווק באינסטגרם ובפייסבוק.
    en: Katya Alon is a marketing consultant with 20 years of experience, offering marketing consulting and strategy, social media management, paid advertising, and Instagram and Facebook training.
