audience:
  title:
    he: למי הליווי מתאים
    en: Who This Guidance Is For
    ru: Для кого подходит сопровождение
  subtitle:
    he: הליווי מתאים לבעלי עסקים, יזמים, חברות וארגונים שרוצים לחדד את הדרך שבה הם
      מציגים את עצמם, לתקשר נכון יותר עם הקהל שלהם, ולבנות נוכחות שיווקית מקצועית,
      ברורה ומדויקת יותר.
    en: This guidance is designed for business owners, entrepreneurs, companies, and
      organizations who want to sharpen the way they present themselves, communicate
      more effectively with their audience, and build a professional, clear, and more
      precise marketing presence.
    ru: Сопровождение подходит владельцам бизнеса, предпринимателям, компаниям и организациям,
      которые хотят точнее представить себя, лучше коммуницировать со своей аудиторией
      и выстроить профессиональное, понятное и более точное маркетинговое присутствие.
  items:
  - he: עסקים שרוצים להיראות מקצועיים וברורים יותר
    en: Businesses that want to look more professional and clear
    ru: Бизнесам, которые хотят выглядеть профессиональнее и понятнее
  - he: חברות שצריכות שיווק עם חשיבה אסטרטגית
