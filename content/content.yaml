about:
  title:
    he: נעים מאוד, אני קטיה אלון
    en: Nice to meet you, I'm Katya Alon
    ru: Рада знакомству, я Катя Алон
  photo_placeholder:
    he: תמונה נוספת של קטיה
    en: Second photo of Katya
    ru: Второе фото Кати
  paragraphs:
  - he: יועצת אסטרטגית ומומחית לשיווק דיגיטלי, עם ניסיון בעבודה עם עסקים במגוון תחומים ובניית מערכות שיווק שמביאות תוצאות בפועל.
      הגישה שלי משלבת חשיבה אסטרטגית, הבנה עמוקה של קהל והתמקדות בתהליכים שמייצרים צמיחה יציבה לאורך זמן.
      מעבר לליווי, אני מכשירה בעלי עסקים לנהל שיווק נכון בעצמם דרך קורס מעשי ומובנה, המבוסס על שיטות עבודה מדויקות וכלים שעובדים בשטח.

    en: A strategic consultant and digital marketing expert, with experience working with businesses in a variety of fields and building marketing systems that bring results in practice.
      My approach combines strategic thinking, a deep understanding of the audience, and a focus on processes that produce stable growth over time.
      Beyond coaching, I train business owners to manage their own marketing properly through a practical and structured course, based on precise working methods and tools that work in the field.
    ru: я стратегический консультант и эксперт по цифровому маркетингу, имею опыт работы с компаниями в различных областях и создания маркетинговых систем, приносящих результаты на практике.
      Мой подход сочетает в себе стратегическое мышление, глубокое понимание целевой аудитории и ориентацию на процессы, обеспечивающие стабильный рост в долгосрочной перспективе.
      Помимо коучинга, я обучаю владельцев бизнеса правильному управлению собственным маркетингом с помощью практического и структурированного курса, основанного на точных методах работы и инструментах, которые эффективны на практике.
  - he: אני מאמינה ששיווק טוב הוא לא רק פרסום או נראות יפה. שיווק טוב מתחיל מהבנה
      אמיתית של העסק, של הערך שלו, ושל הדרך הנכונה לדבר אל האנשים שהוא רוצה להגיע
      אליהם.
    en: I believe good marketing is not just about promotion or attractive visuals.
      Good marketing starts with a real understanding of the business, its value,
      and the right way to speak to the people it wants to reach.
    ru: Я уверена, что хороший маркетинг , это не только реклама или красивая визуальная
      подача. Хороший маркетинг начинается с настоящего понимания бизнеса, его ценности
      и того, как правильно говорить с людьми, до которых он хочет дойти.

