process:
  title:
    he: איך נראה תהליך העבודה
    en: How the Process Works
    ru: Как выглядит процесс работы
  steps:
  - number: 1
    title:
      he: היכרות והבנת הצרכים
      en: Introduction and understanding your needs
      ru: Знакомство и понимание потребностей
    description:
      he: שיחה ראשונית שבה נבין את העסק, המטרות, האתגרים והכיוון הרצוי.
      en: An initial conversation to understand the business, goals, challenges, and
        the direction you want to take.
      ru: Первая встреча, на которой мы понимаем бизнес, цели, задачи и желаемое направление.
  - number: 2
    title:
      he: ניתוח וחידוד
      en: Analysis and refinement
      ru: Анализ и уточнение
    description:
      he: מחדדים את המסרים, מזהים את היתרונות של העסק ובונים אסטרטגיה שיווקית שמאפשרת להגיע לקהל רחב ורלוונטי.
      en: We refine the messaging, identify the business's strengths, and build a marketing strategy that makes it possible to reach a broad, relevant audience.
      ru: Мы уточняем сообщения, определяем преимущества бизнеса и строим маркетинговую стратегию, которая помогает охватить широкую и релевантную аудиторию.
  - number: 3
    title:
      he: בניית כיוון שיווקי
      en: Building a marketing direction
      ru: Формирование маркетингового направления
    description:
      he: יוצרים בסיס ברור לפעילות, אסטרטגיה, מסרים, שפה ודרך עבודה.
      en: We create a clear foundation for activity , strategy, messaging, tone, and
        way of working.
      ru: Создаем понятную основу для дальнейшей работы , стратегию, сообщения, стиль
        и подход.
  - number: 4
    title:
      he: יצירת תוכן ונוכחות
      en: Content and presence creation
      ru: Создание контента и присутствия
    description:
      he: עובדים על התוכן, הנראות והתקשורת השיווקית בפועל.
      en: We work on the content, visibility, and practical marketing communication.
      ru: Работаем над контентом, визуальным присутствием и практической маркетинговой
        коммуникацией.
  - number: 5
    title:
      he: ליווי והתקדמות
      en: Guidance and progress
      ru: Сопровождение и развитие
    description:
      he: ממשיכים לחדד, לשפר ולהתאים את הפעילות לפי הצרכים והמטרות.
      en: We continue refining, improving, and adapting the activity according to
        your needs and goals.
      ru: Продолжаем уточнять, улучшать и адаптировать работу под ваши задачи и цели.

trust:
  title:
    he: ניסיון שמבוסס על עבודה אמיתית בשטח
    en: Experience built on real work in the field
    ru: Опыт, основанный на реальной работе на практике
  text:
    he: העבודה שלי כוללת ליווי של עסקים, חברות וארגונים ממגוון תחומים, תוך התאמה לצרכים,
      לקהל ולמטרות של כל לקוח. אני מאמינה שאין פתרון אחד שמתאים לכולם ,ולכן כל תהליך
      מתחיל בהבנה אמיתית של מי עומד מולי ומה נכון עבורו.
    en: My work includes guiding businesses, companies, and organizations from a variety
      of industries, while adapting to the needs, audience, and goals of each client.
      I believe there is no single solution that fits everyone, which is why every
      process starts with a real understanding of who is in front of me and what is
      right for them.
    ru: Моя работа включает сопровождение бизнесов, компаний и организаций из разных
      сфер, с учетом потребностей, аудитории и целей каждого клиента. Я убеждена,
      что не существует одного решения, которое подходит всем, поэтому каждый процесс
      начинается с настоящего понимания того, кто передо мной и что действительно
      подходит именно ему.

