about:
  title:
    he: נעים מאוד, אני קטיה אלון
    en: Nice to meet you, I'm Katya Alon
    ru: Рада знакомству, я Катя Алон
  photo_placeholder:
    he: תמונה נוספת של קטיה
    en: Second photo of Katya
    ru: Второе фото Кати
  paragraphs:
  - he: אני קטיה אלון, יועצת ואסטרטגית שיווקית, עם 20 שנות ניסיון בתחום השיווק ו-10 שנות ניסיון בשיווק ברשתות החברתיות.
    en: I am Katya Alon, a marketing consultant and strategist with 20 years of experience in marketing and 10 years of experience in social media marketing.
    ru: Я Катя Алон, маркетинговый консультант и стратег с 20-летним опытом в маркетинге и 10-летним опытом продвижения в социальных сетях.
  - he: במהלך השנים עבדתי עם יותר מ-50 עסקים מתחומים שונים, וליוויתי בעלי עסקים בתהליכי בניית אסטרטגיה שיווקית, יצירת תוכן, קידום אורגני ופרסום ממומן.
    en: Over the years, I have worked with more than 50 businesses across different fields and guided business owners through marketing strategy, content creation, organic promotion, and paid advertising.
    ru: За эти годы я работала более чем с 50 компаниями из разных сфер и сопровождала владельцев бизнеса в разработке маркетинговой стратегии, создании контента, органическом продвижении и платной рекламе.
  - he: לצד ניהול השיווק עבור עסקים, אני מתמחה גם בהדרכות ובליווי אישי לבעלי עסקים שרוצים ללמוד לקדם את עצמם באופן עצמאי.
    en: Alongside managing marketing for businesses, I also specialise in training and personal guidance for business owners who want to learn to promote themselves independently.
    ru: Наряду с ведением маркетинга для компаний я специализируюсь на обучении и индивидуальном сопровождении владельцев бизнеса, которые хотят научиться продвигать себя самостоятельно.
  - he: אני מאמינה ששיווק נכון מתחיל בהבנה עסקית ובאסטרטגיה, ולא רק ביצירת פוסטים וסרטונים.
    en: I believe effective marketing begins with business understanding and strategy, not only with creating posts and videos.
    ru: Я считаю, что эффективный маркетинг начинается с понимания бизнеса и стратегии, а не только с создания постов и видео.

services:
  title:
    he: מה אני עושה
    en: What I Do
    ru: Что я делаю
  # Every enabled service is published at /services/<slug>/ (and /en/, /ru/).
  # Slugs are public URLs: do not change them after release. Anchors are the home-page card ids.
  items:
  - title:
      he: ייעוץ ואסטרטגיה שיווקית
      en: Marketing Consulting and Strategy
      ru: Маркетинговый консалтинг и стратегия
    display_order: 1
    anchor: service-marketing-strategy
    slug: marketing-strategy
    description:
      he: בניית אסטרטגיה שיווקית מותאמת לעסק, חידוד המסרים ותכנון הפעילות השיווקית ברשתות החברתיות.
      en: Building a marketing strategy tailored to the business, refining the messaging, and planning social media marketing activity.
      ru: Разработка маркетинговой стратегии под задачи бизнеса, уточнение сообщений и планирование продвижения в социальных сетях.
    details:
      summary:
        he: 'אם אתם פועלים ברשתות החברתיות אבל לא רואים תוצאות, הבעיה היא לא בתוכן, אלא בהיעדר אסטרטגיה ברורה.'
        en: 'If you are active on social media but do not see results, the problem is not the content, but the lack of a clear strategy.'
        ru: 'Если вы работаете в социальных сетях, но не видите результатов, проблема не в контенте, а в отсутствии чёткой стратегии.'
      tech_points:
      - he: ניתוח העסק, המוצר והשוק
        en: Analysis of the business, product, and market
        ru: Анализ бизнеса, продукта и рынка
      - he: הגדרת קהל יעד מדויק
        en: Defining a precise target audience
        ru: Определение точной целевой аудитории
      - he: בניית מסרים שיווקיים שמבדלים אתכם
        en: Building marketing messages that differentiate you
        ru: Формирование маркетинговых сообщений, которые выделяют вас
      - he: בחירת כיוון תוכן ברור
        en: Choosing a clear content direction
        ru: Выбор чёткого направления контента
      - he: תכנון משפך שיווקי שמוביל למכירות
        en: Planning a marketing funnel that leads to sales
        ru: Планирование маркетинговой воронки, ведущей к продажам
      - he: המלצות לפעילות אורגנית וממומנת
        en: Recommendations for organic and paid activity
        ru: Рекомендации по органическому и платному продвижению
      second_tech_points:
      - he: 'אסטרטגיה ברורה ומותאמת לעסק שלכם'
        en: 'A clear strategy tailored to your business'
        ru: 'Чёткую стратегию, адаптированную под ваш бизнес'
      - he: 'תוכנית פעולה מסודרת'
        en: 'A structured action plan'
        ru: 'Чёткий план действий'
      - he: 'הבנה מדויקת מה עובד ומה לא'
        en: 'A precise understanding of what works and what does not'
        ru: 'Точное понимание того, что работает, а что нет'
      - he: 'כיוון ברור לתוכן ולשיווק'
        en: 'A clear direction for content and marketing'
        ru: 'Чёткое направление для контента и маркетинга'
      body:
      - he: רוצים לבנות אסטרטגיה שמביאה תוצאות?
        en: Want to build a strategy that delivers results?
        ru: Хотите выстроить стратегию, которая приносит результаты?
      contact_cta:
        label:
          he: צרו קשר
          en: Contact me
          ru: Связаться с нами
        href:
          he: "https://wa.me/972547838645?text=שלום%20קטיה%2C%20אני%20מעוניין%20לקבל%20פרטים%20נוספים%20על%20האסטרטגיה%20השיווקית."
          en: "https://wa.me/972547838645?text=Hello%20Katya%2C%20I%20would%20like%20to%20get%20more%20details%20about%20your%20marketing%20strategy."
          ru: "https://wa.me/972547838645?text=Здравствуйте%20Катя%2C%20я%20хочу%20получить%20больше%20информации%20о%20вашей%20маркетинговой%20стратегии."
    # Opt-in long-form page. `details` above remains the source for the home card and modal.
    marketing_page:
      heading:
        he: ייעוץ שיווקי ואסטרטגיה שיווקית לעסקים
        en: Marketing Consulting and Strategy for Businesses
        ru: Маркетинговый консалтинг и стратегия для бизнеса
      seo_title:
        he: ייעוץ שיווקי לעסקים | אסטרטגיה שיווקית - קטיה אלון
        en: Marketing Consulting for Businesses | Marketing Strategy - Katya Alon
        ru: Маркетинговый консалтинг для бизнеса | Маркетинговая стратегия — Катя Алон
      meta_description:
        he: ייעוץ שיווקי ואסטרטגיה שיווקית לעסקים עם קטיה אלון. ניתוח הפעילות השיווקית, בניית תוכנית פעולה, קידום באינסטגרם ובפייסבוק והגדלת פניות מלקוחות.
        en: Marketing consulting and strategy for businesses with Katya Alon. Review your marketing activity, build an action plan, promote on Instagram and Facebook, and increase client inquiries.
        ru: Маркетинговый консалтинг и стратегия для бизнеса с Катей Алон. Анализ маркетинговой деятельности, план действий, продвижение в Instagram и Facebook и рост обращений клиентов.
      lead:
        he: משקיעים זמן וכסף בשיווק העסק, אבל לא רואים מספיק לקוחות ותוצאות?
        en: Are you investing time and money in marketing your business but not seeing enough clients and results?
        ru: Вкладываете время и деньги в маркетинг бизнеса, но не видите достаточно клиентов и результатов?
      paragraphs:
      - he: מעלים פוסטים, מצלמים רילסים, פעילים באינסטגרם ובפייסבוק, אבל לא באמת יודעים מה עובד ומה צריך לשנות?
        en: You post, film reels, and stay active on Instagram and Facebook, but do not really know what works or what needs to change?
        ru: Публикуете посты, снимаете reels, активны в Instagram и Facebook, но не знаете, что работает и что нужно изменить?
      - he: ייעוץ שיווקי מקצועי נועד לעשות סדר, לזהות הזדמנויות ולבנות אסטרטגיה שיווקית שמתאימה לעסק שלכם.
        en: Professional marketing consulting brings clarity, identifies opportunities, and builds a marketing strategy that suits your business.
        ru: Профессиональный маркетинговый консалтинг помогает навести порядок, увидеть возможности и выстроить стратегию, подходящую вашему бизнесу.
      - he: עם 20 שנות ניסיון בשיווק ו-10 שנות ניסיון ברשתות החברתיות, אני עוזרת לבעלי עסקים להבין איך להשתמש בשיווק דיגיטלי כדי למשוך לקוחות, להגדיל הכנסות ולפתח את העסק.
        en: With 20 years of marketing experience and 10 years in social media, I help business owners understand how to use digital marketing to attract clients, increase revenue, and develop their business.
        ru: Имея 20 лет опыта в маркетинге и 10 лет опыта в социальных сетях, я помогаю владельцам бизнеса понять, как использовать цифровой маркетинг для привлечения клиентов, роста доходов и развития бизнеса.
      includes_title:
        he: מה כולל הייעוץ השיווקי?
        en: What Does Marketing Consulting Include?
        ru: Что включает маркетинговый консалтинг?
      includes:
      - label: {he: "ניתוח העסק והפעילות השיווקית הקיימת:", en: "Analysis of your business and current marketing activity:", ru: "Анализ бизнеса и текущей маркетинговой деятельности:"}
        text: {he: "נבין מה עובד, מה פחות ואיפה נמצאות ההזדמנויות לשיפור.", en: "We will understand what works, what works less well, and where opportunities to improve lie.", ru: "Мы разберём, что работает, что работает хуже и где есть возможности для улучшения."}
      - label: {he: "בניית אסטרטגיה שיווקית:", en: "Building a marketing strategy:", ru: "Разработка маркетинговой стратегии:"}
        text: {he: "נתכנן איך להגיע לקהל רחב ורלוונטי ולהפוך חשיפה להתעניינות ולפניות.", en: "We will plan how to reach a broad, relevant audience and turn exposure into interest and inquiries.", ru: "Мы спланируем, как охватить широкую релевантную аудиторию и превратить охват в интерес и обращения."}
      - label: {he: "חידוד המסרים השיווקיים:", en: "Refining marketing messages:", ru: "Уточнение маркетинговых сообщений:"}
        text: {he: "נבין איך להציג את היתרונות של העסק בצורה שמדברת ללקוחות.", en: "We will understand how to present your business's advantages in a way that speaks to clients.", ru: "Мы разберём, как представить преимущества бизнеса так, чтобы это находило отклик у клиентов."}
      - label: {he: "תכנון תוכן לאינסטגרם ולפייסבוק:", en: "Planning content for Instagram and Facebook:", ru: "Планирование контента для Instagram и Facebook:"}
        text: {he: "נבנה כיוון ברור ליצירת תוכן שמושך תשומת לב, מחזק אמון ומעודד מכירות.", en: "We will build a clear direction for content that attracts attention, strengthens trust, and encourages sales.", ru: "Мы выстроим понятное направление для контента, который привлекает внимание, укрепляет доверие и стимулирует продажи."}
      - label: {he: "המלצות לקידום אורגני ופרסום ממומן:", en: "Recommendations for organic promotion and paid advertising:", ru: "Рекомендации по органическому продвижению и платной рекламе:"}
        text: {he: "נבחן אילו פעולות שיווקיות מתאימות לעסק שלכם ובמה כדאי להשקיע.", en: "We will consider which marketing actions suit your business and what is worth investing in.", ru: "Мы рассмотрим, какие маркетинговые действия подходят вашему бизнесу и во что стоит вкладываться."}
      outcomes_title:
