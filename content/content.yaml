    he: עם 20 שנות ניסיון בשיווק ו-10 שנות ניסיון ברשתות החברתיות, אני מציעה ייעוץ שיווקי, בניית אסטרטגיה שיווקית, ניהול סושיאל, פרסום ממומן והדרכות לבעלי עסקים שרוצים ללמוד לשווק את העסק שלהם בעצמם.
    en: With 20 years of marketing experience and 10 years of social media experience, I offer marketing consulting, marketing strategy, social media management, paid advertising, and training for business owners who want to learn to market their business independently.
    ru: Имея 20 лет опыта в маркетинге и 10 лет опыта в социальных сетях, я предлагаю маркетинговый консалтинг, разработку стратегии, ведение соцсетей, платную рекламу и обучение владельцев бизнеса, которые хотят самостоятельно продвигать своё дело.
