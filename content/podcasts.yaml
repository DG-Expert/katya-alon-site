    - {he: "אני מזמינה אתכם לצפות, להקשיב ולהכיר גם את הצד שמאחורי העבודה היומיומית.", en: "I invite you to watch, listen, and get to know the side behind the day-to-day work as well.", ru: "Я приглашаю вас посмотреть, послушать и познакомиться также со стороной, которая стоит за повседневной работой."}
    - {he: "בהמשך יתווספו לכאן שיחות וסרטונים נוספים.", en: "More conversations and videos will be added here over time.", ru: "Со временем здесь появятся новые беседы и видео."}
