content_1:
  kicker: {he: "01 · למי ההכשרה מתאימה?", en: "01 · Who is it for?", ru: "01 · Для кого обучение?"}
  title: {he: "שיווק עצמאי, מסודר ומקצועי", en: "Independent, structured, professional marketing", ru: "Самостоятельный, системный и профессиональный маркетинг"}
  paragraphs:
    - {he: "1. לעורכי דין עצמאיים ובעלי משרדים שרוצים להגדיל את החשיפה ולהגיע ללקוחות פוטנציאליים.", en: "1. Independent lawyers and firm owners who want to increase visibility and reach potential clients.", ru: "1. Независимым юристам и владельцам фирм, которые хотят повысить узнаваемость и привлечь потенциальных клиентов."}
    - {he: "2. לעורכי דין שכבר פעילים ברשתות החברתיות, אבל לא מצליחים להפוך את הפעילות לפניות.", en: "2. Lawyers already active on social media who are not turning that activity into enquiries.", ru: "2. Юристам, уже активным в соцсетях, но не превращающим эту активность в обращения."}
    - {he: "3. למי שרוצה להתחיל לשווק את המשרד, אבל לא יודע מה לפרסם ואיך לעשות זאת נכון.", en: "3. Those who want to start marketing their firm but do not know what to publish or how to do it properly.", ru: "3. Тем, кто хочет начать продвигать фирму, но не знает, что публиковать и как делать это правильно."}
    - {he: "4. למי שמבין ששיווק הוא חלק מפיתוח העסק, אבל לא רוצה להיות תלוי באופן קבוע באנשי מקצוע חיצוניים.", en: "4. Those who understand marketing is part of business development but do not want permanent dependence on outside professionals.", ru: "4. Тем, кто понимает, что маркетинг является частью развития бизнеса, но не хочет постоянно зависеть от внешних специалистов."}
    - {he: "5. למי שרוצה ללמוד לעבוד בצורה מסודרת, מקצועית ואסטרטגית, גם ללא ניסיון קודם בשיווק דיגיטלי.", en: "5. Those who want to learn to work in an organised, professional, strategic way, even without prior digital-marketing experience.", ru: "5. Тем, кто хочет научиться работать системно, профессионально и стратегически даже без опыта в digital-маркетинге."}
content_2:
  kicker: {he: "02 · מה תקבלו מההכשרה?", en: "02 · What will you gain?", ru: "02 · Что вы получите?"}
  title: {he: "לא רק ידע תיאורטי, כלים מעשיים", en: "Not just theory: practical tools", ru: "Не только теория, практические инструменты"}
  intro: {he: "כל התכנים והדוגמאות מותאמים לעולם עריכת הדין, תוך התייחסות לכללי האתיקה והפרסום החלים על עורכי דין.", en: "All content and examples are adapted to the legal profession, with attention to lawyers’ applicable ethics and advertising rules.", ru: "Все материалы и примеры адаптированы к юридической профессии с учётом применимых правил этики и рекламы."}
  items:
    - {title: {he: "אסטרטגיה למשרד", en: "A strategy for your firm", ru: "Стратегия для фирмы"}, text: {he: "תלמדו לזהות את קהל היעד, להבין מה מייחד אתכם ולהציג את תחום ההתמחות כך שיעורר עניין אצל לקוחות פוטנציאליים.", en: "Learn to identify your target audience, understand what distinguishes you, and present your specialty to interest potential clients.", ru: "Научитесь определять аудиторию, понимать свои отличия и представлять специализацию так, чтобы заинтересовать потенциальных клиентов."}}
    - {title: {he: "רעיונות לתוכן", en: "Content ideas", ru: "Идеи для контента"}, text: {he: "תפסיקו לשאול מה לפרסם היום: תמצאו רעיונות מתוך שאלות, בעיות וחששות של לקוחות ותהפכו ידע משפטי לפוסטים ולרילסים.", en: "Stop asking what to publish today: find ideas in clients’ questions, problems, and concerns, and turn legal knowledge into posts and reels.", ru: "Перестанете спрашивать, что публиковать сегодня: найдёте идеи в вопросах, проблемах и опасениях клиентов и превратите юридические знания в посты и reels."}}
    - {title: {he: "תוכן שבונה אמון", en: "Content that builds trust", ru: "Контент, создающий доверие"}, text: {he: "תבינו איך להציג את עצמכם כמומחים, להסביר נושאים משפטיים בצורה נגישה ולבנות נוכחות מקצועית שמחזקת מוניטין.", en: "Understand how to present yourselves as experts, explain legal topics accessibly, and build a presence that strengthens reputation.", ru: "Поймёте, как представлять себя экспертами, доступно объяснять юридические темы и строить профессиональное присутствие, укрепляющее репутацию."}}
    - {title: {he: "איך הפורמטים עובדים", en: "How formats work", ru: "Как работают форматы"}, text: {he: "תכירו את ההבדלים בין רילסים, פוסטים, קרוסלות וסטוריז ואיך להשתמש בכל אחד למטרות שיווקיות שונות.", en: "Learn the differences between reels, posts, carousels, and stories and how to use each for different marketing goals.", ru: "Узнаете различия между reels, постами, каруселями и stories и как использовать каждый для разных маркетинговых целей."}}
    - {title: {he: "מחשיפה לפניות", en: "From visibility to enquiries", ru: "От узнаваемости к обращениям"}, text: {he: "תבינו איך לבנות תוכן שמוביל מהיכרות ראשונית עם המשרד, דרך בניית אמון ועד לרצון ליצור קשר.", en: "Understand how to build content leading from first awareness of the firm, through trust-building, to wanting contact.", ru: "Поймёте, как создавать контент, ведущий от первого знакомства с фирмой через доверие к желанию связаться."}}
    - {title: {he: "ניהול עצמאי", en: "Independent management", ru: "Самостоятельное ведение"}, text: {he: "תקבלו שיטה לתכנון תוכן, עבודה עקבית ושילוב השיווק בשגרת העבודה בלי לבזבז שעות מיותרות.", en: "Receive a method for planning content, working consistently, and fitting marketing into your routine without wasting hours.", ru: "Получите метод планирования контента, последовательной работы и включения маркетинга в рабочий распорядок без лишней траты часов."}}
