content_3:
  kicker: {he: "03 · איך ההכשרה מתבצעת?", en: "03 · How does it work?", ru: "03 · Как проходит обучение?"}
  title: {he: "שני מפגשים, בסיס להמשך הדרך", en: "Two sessions, a foundation for the road ahead", ru: "Две встречи, основа для дальнейшего пути"}
  intro: {he: "שני מפגשים קבוצתיים בלייב בזום, שעתיים בכל מפגש. במהלך ארבע שעות הלימוד נשלב הסברים, דוגמאות מעשיות ותרגול כדי להבין לא רק מה לעשות אלא גם איך לעשות זאת בפועל.", en: "Two group sessions live on Zoom, two hours each. Across four learning hours we combine explanations, practical examples, and exercises to understand not only what to do but how to do it.", ru: "Две групповые живые встречи в Zoom, по два часа каждая. За четыре часа обучения будут объяснения, практические примеры и упражнения, чтобы понять не только что делать, но и как."}
  items:
    - {question: {he: "מועד ומיקוד", en: "Date and focus", ru: "Дата и фокус"}, answer: {he: "המפגש הראשון ב־16.11.2026. מועד המפגש השני יימסר לנרשמים. ההכשרה מיועדת לעורכי דין בלבד ומתמקדת באתגרים השיווקיים של משרדי עורכי דין.", en: "The first session is 16 Nov 2026. The second-session date will be provided to registrants. The training is for lawyers only and focuses on law firms’ marketing challenges.", ru: "Первая встреча: 16.11.2026. Дату второй сообщат зарегистрированным. Обучение только для юристов и посвящено маркетинговым задачам юридических фирм."}}
    - {question: {he: "מכל מקום", en: "From anywhere", ru: "Из любого места"}, answer: {he: "אפשר להשתתף מכל מקום, בלי לצאת מהמשרד ובלי לבזבז זמן על נסיעות.", en: "Join from anywhere, without leaving the office or spending time travelling.", ru: "Участвовать можно из любого места, не выходя из офиса и не тратя время на дорогу."}}
    - {question: {he: "למה דווקא עכשיו?", en: "Why now?", ru: "Почему сейчас?"}, answer: {he: "אנחנו מתקרבים לסוף השנה. זה זמן לבחון את שיווק המשרד ולהיערך לשנה הבאה. הבעיה אינה תמיד חוסר זמן; לפעמים חסרה שיטה ברורה. במקום לדחות או לפרסם בלי אסטרטגיה, ארבע שעות יכולות לתת בסיס מקצועי. הידע המשפטי שלכם הוא נכס מקצועי. הגיע הזמן להשתמש בו גם בשיווק.", en: "Year end is approaching. This is a time to examine the firm’s marketing and prepare for next year. The issue is not always time; sometimes a clear method is missing. Instead of postponing or publishing without strategy, four hours can provide a professional foundation. Your legal knowledge is an asset. It is time to use it in marketing too.", ru: "Конец года приближается. Это время оценить маркетинг фирмы и подготовиться к следующему году. Дело не всегда во времени; иногда не хватает ясной системы. Вместо откладывания или публикаций без стратегии четыре часа могут дать профессиональную основу. Ваши юридические знания являются активом, и пора использовать их в маркетинге."}}
