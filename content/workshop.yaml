  subtitle: {he: "יש לכם אינסטגרם או פייסבוק, אבל הם לא מביאים מספיק פניות למשרד?", en: "Do you have Instagram or Facebook, but they are not bringing enough enquiries to your firm?", ru: "У вас есть Instagram или Facebook, но они не приводят достаточно обращений в вашу фирму?"}
  description: {he: "אתם יודעים שאתם צריכים לשווק את עצמכם, אבל לא תמיד יודעים מה לפרסם, איך להגיע לקהל הנכון ואיך להפוך את הנוכחות ברשתות לכלי שמקדם את המשרד. אולי אינכם צריכים מנהל סושיאל, אלא ללמוד לעשות זאת נכון.", en: "You know you need to market yourselves, but do not always know what to publish, how to reach the right audience, or turn social presence into a tool that advances the firm. Perhaps you do not need a social-media manager. You need to learn to do it properly.", ru: "Вы знаете, что нужно продвигать себя, но не всегда знаете, что публиковать, как найти нужную аудиторию и превратить присутствие в соцсетях в инструмент развития фирмы. Возможно, вам нужен не SMM-менеджер, а умение делать это правильно."}
  details_kicker: {he: "בזום · בלייב", en: "Live on Zoom", ru: "Вживую в Zoom"}
