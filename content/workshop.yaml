instructor:
  kicker: {he: "מי מעבירה את ההכשרה?", en: "Who leads the training?", ru: "Кто проводит обучение?"}
  title: {he: "קטיה אלון", en: "Katya Alon", ru: "Катя Алон"}
  role: {he: "אסטרטגיה שיווקית ושיווק דיגיטלי", en: "Marketing Strategy and Digital Marketing", ru: "Маркетинговая стратегия и цифровой маркетинг"}
  image: {src: "./assets/images/katya-workshop-cutout.png", alt: {he: "דיוקן של קטיה אלון", en: "Portrait of Katya Alon", ru: "Портрет Кати Алон"}}
  paragraphs:
    - {he: "אני עוסקת בשיווק כבר כ־20 שנה, מתוכן כעשור בתחום הרשתות החברתיות. במהלך השנים עבדתי עם עשרות עסקים מתחומים שונים, בניתי אסטרטגיות שיווקיות, ניהלתי פעילות דיגיטלית וליוויתי בעלי עסקים בתהליכי צמיחה.", en: "I have worked in marketing for about 20 years, including about a decade in social media. I have worked with dozens of businesses across fields, built marketing strategies, managed digital activity, and accompanied owners through growth.", ru: "Я работаю в маркетинге около 20 лет, из них примерно десятилетие в социальных сетях. Я работала с десятками бизнесов из разных сфер, строила стратегии, вела цифровую активность и сопровождала владельцев в процессах роста."}
    - {he: "כיום, לצד שירותי השיווק לעסקים, אני מתמקדת גם בהדרכות ובהכשרות מקצועיות שמאפשרות לבעלי עסקים ללמוד לשווק את עצמם. אני מאמינה שלא כל בעל עסק צריך מנהל סושיאל, אבל כל בעל עסק צריך להבין איך השיווק שלו עובד. המטרה שלי היא לתת לכם ידע, ביטחון וכלים לקחת חלק פעיל בקידום המשרד.", en: "Today, alongside marketing services, I focus on professional instruction that lets owners learn to market themselves. I believe not every owner needs a social-media manager, but every owner needs to understand how marketing works. My goal is to give you knowledge, confidence, and tools to take an active role in advancing your firm.", ru: "Сегодня наряду с маркетинговыми услугами я занимаюсь профессиональным обучением, позволяющим владельцам бизнеса продвигать себя. Я считаю, что не каждому нужен SMM-менеджер, но каждому важно понимать маркетинг. Моя цель: дать вам знания, уверенность и инструменты для активного продвижения фирмы."}
form:
  kicker: {he: "מוכנים להפסיק לדחות את השיווק שלכם?", en: "Ready to stop postponing your marketing?", ru: "Готовы перестать откладывать маркетинг?"}
  title: {he: "ההכשרה מתחילה ב־16 בנובמבר 2026", en: "Training starts 16 November 2026", ru: "Обучение начинается 16 ноября 2026"}
  intro: {he: "שני מפגשים. ארבע שעות. ידע וכלים שתוכלו להמשיך להשתמש בהם גם לאחר סיום ההכשרה. השאירו פרטים ואחזור אליכם להשלמת ההרשמה.", en: "Two sessions. Four hours. Knowledge and tools you can continue using after training. Leave your details and I will get back to complete registration.", ru: "Две встречи. Четыре часа. Знания и инструменты, которыми вы сможете пользоваться после обучения. Оставьте данные, и я свяжусь с вами для завершения регистрации."}
  demo_notice: {he: "הדגמה בלבד. ההרשמה אינה פתוחה. שום מידע אינו נשלח, נשמר או יוצר הרשמה. אין כרגע הגנת CAPTCHA או מנגנון נגד בוטים.", en: "DEMO ONLY. Registration is not open. No information is transmitted, stored, or turned into a registration. No CAPTCHA or anti-bot protection is enabled.", ru: "ТОЛЬКО ДЕМО. Регистрация не открыта. Информация не передаётся, не сохраняется и не создаёт заявку. CAPTCHA и защита от ботов не подключены."}
  privacy_note: {he: "ההכשרה מיועדת ללימוד שיווק עצמאי ואינה כוללת ניהול בפועל של הרשתות החברתיות, יצירת תוכן עבור המשתתפים או התחייבות למספר פניות או לקוחות. עלות ההכשרה עשויה להיות מוכרת כהוצאה לצורכי מס בהתאם לנסיבות ולהוראות הדין; מומלץ לבדוק מול רואה החשבון.", en: "The training teaches independent marketing and does not include hands-on social-media management, content creation for participants, or a commitment to enquiries or clients. Its cost may be recognised as a tax expense depending on circumstances and law; consult your accountant.", ru: "Обучение посвящено самостоятельному маркетингу и не включает фактическое ведение соцсетей, создание контента для участников или обязательство по обращениям либо клиентам. Его стоимость может быть признана расходом для налогообложения в зависимости от обстоятельств и закона; уточните у бухгалтера."}
  submit_label: {he: "אני רוצה להירשם להכשרה", en: "I want to register for the training", ru: "Я хочу зарегистрироваться на обучение"}
  fields:
    full_name: {label: {he: "שם מלא", en: "Full name", ru: "Полное имя"}, placeholder: {he: "לדוגמה: יעל כהן", en: "For example: Maya Cohen", ru: "Например: Анна Иванова"}, help: {he: "אותיות ורווחים בלבד, ללא ספרות.", en: "Letters and spaces only; no digits.", ru: "Только буквы и пробелы, без цифр."}, errors: {required: {he: "יש להזין שם מלא.", en: "Enter a full name.", ru: "Введите полное имя."}, invalid: {he: "השם חייב לכלול לפחות שתי אותיות וללא ספרות.", en: "The name must contain at least two letters and no digits.", ru: "Имя должно содержать не менее двух букв и не содержать цифр."}}}
    mobile: {label: {he: "מספר טלפון", en: "Phone number", ru: "Номер телефона"}, placeholder: {he: "12345678", en: "12345678", ru: "12345678"}, help: {he: "8–15 ספרות ASCII בלבד.", en: "8–15 ASCII digits only.", ru: "Только 8–15 цифр ASCII."}, errors: {required: {he: "יש להזין מספר טלפון.", en: "Enter a phone number.", ru: "Введите номер телефона."}, invalid: {he: "יש להזין 8–15 ספרות בלבד.", en: "Enter 8–15 digits only.", ru: "Введите 8–15 цифр."}}}
    email: {label: {he: "כתובת דוא״ל", en: "Email address", ru: "Адрес электронной почты"}, placeholder: {he: "name@example.com", en: "name@example.com", ru: "name@example.com"}, help: {he: "כתובת במבנה name@example.com.", en: "Use name@example.com format.", ru: "Используйте формат name@example.com."}, errors: {required: {he: "יש להזין כתובת דוא״ל.", en: "Enter an email address.", ru: "Введите адрес электронной почты."}, invalid: {he: "יש להזין כתובת דוא״ל תקינה.", en: "Enter a valid email address.", ru: "Введите корректный адрес электронной почты."}}}
    expertise: {label: {he: "תחום התמחות", en: "Area of expertise", ru: "Область специализации"}, placeholder: {he: "לדוגמה: שיווק, עיצוב או ייעוץ", en: "For example: Marketing, design, or consulting", ru: "Например: маркетинг, дизайн или консалтинг"}, help: {he: "טקסט חופשי המתאר את תחום ההתמחות, לפחות שני תווים וללא ספרות.", en: "Free text describing your area of expertise; at least two characters and no digits.", ru: "Свободный текст с описанием области специализации: минимум два символа, без цифр."}, errors: {required: {he: "יש להזין תחום התמחות.", en: "Enter your area of expertise.", ru: "Укажите область специализации."}, too_short: {he: "יש להזין לפחות שני תווים.", en: "Enter at least two characters.", ru: "Введите не менее двух символов."}, has_digit: {he: "תחום ההתמחות אינו יכול לכלול ספרות.", en: "The expertise area cannot contain digits.", ru: "Специализация не может содержать цифры."}}}
  status:
    fix_errors: {he: "יש לתקן את השדות המסומנים. דבר לא נשלח.", en: "Correct the marked fields. Nothing was sent.", ru: "Исправьте отмеченные поля. Ничего не отправлено."}
    no_registration: {he: "כל השדות תקינים, אך זו הדגמה בלבד: לא נוצרה הרשמה ושום מידע לא הועבר.", en: "All fields are valid, but this is a demo only: no registration was created and no information was transmitted.", ru: "Все поля верны, но это только демо: регистрация не создана и информация не передана."}
footer: {rights: {he: "כל הזכויות שמורות", en: "All rights reserved", ru: "Все права защищены"}}
