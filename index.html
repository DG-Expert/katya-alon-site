<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title is updated dynamically from content.yaml -->
  <title>Katya Alon — Marketing Strategy & Content</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- js-yaml for parsing content.yaml -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FAF8F5',
          charcoal: '#121111',
          purple: '#7A5CFF',
          goldrose: '#C9A3A3',
          gray: '#7d7c82',
          white: '#FFFFFF'
        }
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }

* {
  box-sizing: border-box;
  cursor: default;
  }

a,
button,
[role="button"],
.service-trigger,
.modal-close,
.modal-backdrop,
.modal-video-link {
  cursor: pointer;
}

input,
textarea,
select {
  cursor: default;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes clientsMarquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

.fade-up {
  opacity: 0;
}

.fade-up.visible {
  animation: fadeUp 0.7s ease forwards;
}

.lang-btn {
  transition: all 0.3s ease;
}

.lang-btn.active,
.lang-btn:hover {
  color: #7a5cff;
  border-bottom: 2px solid #7A5CFF;
}

.cta-primary {
  background: #7A5CFF;
  color: #f1eded;
  transition: all 0.3s ease;
}

.cta-primary:hover {
  background: #20c00b;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(47, 107, 255, 0.3);
}

.cta-secondary {
  background: #483696;
  border: 1.5px solid #483696;
  color: #f1eded;
  transition: all 0.3s ease;
}

.cta-secondary:hover {
  background: #20c00b;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(47, 107, 255, 0.3);
}

.nav-link {
  position: relative;
  transition: color 0.3s ease;
  color: #C9A3A3;
  font-size: 1.25rem;
}

.nav-link::after {
  content: "";
  position: absolute;
  bottom: -2px;
  width: 0;
  height: 2.5px;
  background: #7A5CFF;
  transition: width 0.3s ease;
}

[dir="rtl"] .nav-link::after {
  right: 0;
}

[dir="ltr"] .nav-link::after {
  left: 0;
}

.nav-link:hover::after {
  width: 100%;
}

.nav-link:hover {
  color: #7A5CFF;
}

.portrait-placeholder {
  background: linear-gradient(135deg, #636363 0%, #383737 50%, #0B0B0B 100%);
  border: 1px solid rgba(201, 163, 163, 0.18);
}

.service-row,
.audience-card,
.process-card {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  color: #7A5CFF;
}

.service-row:hover,
.audience-card:hover,
.process-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(140, 120, 255, 0.486);
}

.service-trigger {
  width: 100%;
  text-align: inherit;
  background: transparent;
  border: none;
  padding: 0;
  display: block;
}

.service-trigger .service-row {
  position: relative;
}

.service-trigger .service-row::after {
  content: "+";
  position: absolute;
  top: 1.25rem;
  inset-inline-end: 1.25rem;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 9999px;
  border: 1px solid rgba(122, 92, 255, 0.35);
  color: #7A5CFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  line-height: 1;
  background: rgba(122, 92, 255, 0.05);
}

.service-trigger:focus-visible .service-row,
.modal-close:focus-visible,
.modal-video-link:focus-visible {
  outline: 2px solid #7A5CFF;
  outline-offset: 3px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11, 11, 11, 0.72);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
}

.modal-panel {
  width: min(100%, 860px);
  max-height: min(88vh, 920px);
  overflow: auto;
  background: #111111;
  color: #FFFFFF;
  border: 1px solid rgba(201, 163, 163, 0.24);
  border-radius: 1.25rem;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}

.modal-close {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 9999px;
  border: 1px solid rgba(201, 163, 163, 0.24);
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.04);
  transition: all 0.25s ease;
}

.modal-close:hover {
  background: rgba(122, 92, 255, 0.18);
  border-color: rgba(122, 92, 255, 0.4);
}

.modal-chip {
  border: 1px solid rgba(201, 163, 163, 0.24);
  background: rgba(255, 255, 255, 0.03);
  color: #C9A3A3;
  border-radius: 9999px;
  padding: 0.45rem 0.75rem;
  font-size: 0.875rem;
  line-height: 1.3;
}

.modal-video-box {
  border: 1px solid rgba(201, 163, 163, 0.18);
  border-radius: 1rem;
  background: linear-gradient(135deg, rgba(122, 92, 255, 0.12), rgba(201, 163, 163, 0.08));
  padding: 1rem;
}

.modal-video-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #FFFFFF;
  background: #7A5CFF;
  border-radius: 9999px;
  padding: 0.85rem 1.1rem;
  transition: all 0.25s ease;
}

.modal-video-link:hover {
  background: #6947ff;
  transform: translateY(-1px);
}

.modal-hidden {
  display: none;
}

/* Clients marquee */
.clients-marquee {
  position: relative;
  width: 100%;
  overflow: hidden;
  direction: ltr;
}

#clients-strip {
  display: flex;
  width: max-content;
  direction: ltr;
}

.clients-marquee-inner {
  display: flex;
  align-items: flex-start;
  width: max-content;
  direction: ltr;
  animation: clientsMarquee 70s linear infinite;
  will-change: transform;
}

.clients-marquee:hover .clients-marquee-inner {
  animation-play-state: paused;
}

.marquee-track {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: flex-start;
  gap: 80px;
  flex-shrink: 0;
  direction: ltr;
}

.client-item {
  width: 220px;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  text-align: center;
  padding: 0 10px;
  flex-shrink: 0;
}

.site-logo-link {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}

.site-logo {
  display: block;
  width: auto;
  height: 100px;
  object-fit: contain;
}

.client-logo-box {
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.client-logo-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.client-logo-name {
  margin-top: 14px;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.35;
  color: #e9e9e9;
  text-align: center;
  white-space: normal;
}

@keyframes clientsMarquee {
  0% {
    transform: translate3d(0, 0, 0);
  }
  100% {
    transform: translate3d(-50%, 0, 0);
  }
}

@media (max-width: 768px) {
  .client-item {
    width: 180px;
    min-width: 180px;
  }

  .client-logo-box {
    width: 150px;
    height: 150px;
  }

  .client-logo-name {
    font-size: 16px;
  }

  .marquee-track {
    gap: 48px;
  }

  .clients-marquee-inner {
    animation-duration: 55s;
  }

  .site-logo {
    height: 44px;
    max-width: 150px;
  }
}


/* Centralized color control classes */
.page-theme {
  background-color: #FAF8F5;
  color: #121111;
}

.site-header-theme {
  background-color: rgba(250, 248, 245, 0.9);
  border-bottom-color: rgba(201, 163, 163, 0.6);
}

.brand-text-main { color: #121111; }
.brand-text-accent { color: #7A5CFF; }
.nav-text-theme { color: #C9A3A3; }
.lang-switcher-theme { border-color: #C9A3A3; }
.separator-theme { color: #C9A3A3; }
.mobile-nav-theme {
  background-color: #FAF8F5;
  border-top-color: #C9A3A3;
}
.hero-subtitle-theme { color: #121111; }
.hero-description-theme { color: #121111; }
.section-text-muted { color: #121111; }
.footer-text-muted { color: #121111; }
.footer-rights-muted { color: #121111; }
.clients-section-theme {
  background-color: #7A5CFF;
  border-top-color: rgba(201, 163, 163, 0.4);
  border-bottom-color: rgba(201, 163, 163, 0.4);
}
.clients-subtitle-theme { color: #f1eded; }
.services-section-theme { background-color: rgba(255, 255, 255, 0.4); }
.why-section-theme { background-color: #7A5CFF; }
.trust-section-theme { background-color: #7A5CFF; }
.footer-theme { border-top-color: rgba(201, 163, 163, 0.4); }
.footer-brand-muted { color: rgba(125, 124, 130, 0.5); }
.footer-brand-name { color: rgba(18, 17, 17, 0.6); }
.footer-rights-muted { color: rgba(125, 124, 130, 0.4); }

.legacy-modal-backdrop-theme { background-color: rgba(0, 0, 0, 0.7); }
.legacy-modal-panel-theme {
  background-color: #7A5CFF;
  border-color: rgba(201, 163, 163, 0.3);
}
.legacy-modal-close-theme { color: rgba(255, 255, 255, 0.7); }
.legacy-modal-close-theme:hover { color: #FFFFFF; }
.legacy-modal-title-theme,
.legacy-modal-heading-theme,
.legacy-modal-video-title-theme { color: #FFFFFF; }
.legacy-modal-summary-theme { color: #f1eded; }

.modal-summary-theme { color: rgba(255, 255, 255, 0.85); }
.modal-body-theme,
.modal-video-description-theme { color: rgba(255, 255, 255, 0.72); }

.about-paragraph-theme { color: #121111; }
.service-card-theme {
  background-color: #FAF8F5;
  border: 1px solid rgba(201, 163, 163, 0.5);
}
.service-card-title-theme { color: #7A5CFF; }
.service-card-description-theme { color: #121111; }
.audience-card-theme {
  background-color: #7A5CFF;
  border: 1px solid rgba(201, 163, 163, 0.3);
  color: #f1eded;
}
.process-card-theme {
  background-color: #7A5CFF;
  border: 1px solid rgba(201, 163, 163, 0.4);
}
.process-step-number-theme { color: #7A5CFF; }
.process-step-title-theme { color: #121111; }
.process-step-description-theme { color: #f1eded; }
.modal-list-item-theme,
.modal-body-paragraph-theme { color: #FFFFFF; }
.modal-video-frame-theme { border: 1px solid rgba(201, 163, 163, 0.3); }

.modal-kicker-theme,
.modal-points-title-theme,
.modal-video-heading-theme { color: #C9A3A3; }

</style>
</head>
<body class="h-full w-full overflow-auto page-theme" style="font-family: 'Rubik', Assistant;">

  <!-- ═══════════ Header / Navigation ═══════════ -->
  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md border-b site-header-theme">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
      <a href="#hero" class="site-logo-link" aria-label="Katya Alon home">
        <img
          src="/assets/images/Kate%20NoBackground%20Logo.png"
          alt="Katya Alon Digital Marketing"
          class="site-logo"
        />
      </a>

      <!-- Desktop nav — text filled from content.yaml -->
      <nav class="hidden md:flex items-center gap-6 text-sm font-light nav-text-theme">
        <a href="#about" class="nav-link" data-content="nav.about"></a>
        <a href="#services" class="nav-link" data-content="nav.services"></a>
        <a href="#process" class="nav-link" data-content="nav.process"></a>
        <a href="#contact" class="nav-link" data-content="nav.contact"></a>
      </nav>

      <div class="flex items-center gap-4">
        <!-- Language switcher -->
        <div class="flex items-center gap-1 text-sm border rounded-full px-3 py-1.5 lang-switcher-theme">
          <button onclick="switchLang('he')" class="lang-btn px-2 py-0.5 rounded active" id="btn-he">HE</button>
          <span class="separator-theme">|</span>
          <button onclick="switchLang('en')" class="lang-btn px-2 py-0.5 rounded" id="btn-en">EN</button>
          <span class="separator-theme">|</span>
          <button onclick="switchLang('ru')" class="lang-btn px-2 py-0.5 rounded" id="btn-ru">RU</button>
        </div>

        <button class="md:hidden" onclick="toggleMobile()" aria-label="Toggle menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Mobile nav -->
    <div id="mobile-nav" class="hidden md:hidden border-t px-5 pb-4 mobile-nav-theme">
      <nav class="flex flex-col gap-3 text-sm pt-3 nav-text-theme">
        <a href="#about" onclick="closeMobile()" class="py-1" data-content="nav.about"></a>
        <a href="#services" onclick="closeMobile()" class="py-1" data-content="nav.services"></a>
        <a href="#process" onclick="closeMobile()" class="py-1" data-content="nav.process"></a>
        <a href="#contact" onclick="closeMobile()" class="py-1" data-content="nav.contact"></a>
      </nav>
    </div>
  </header>

  <!-- ═══════════ Hero Section ═══════════ -->
  <section id="hero" class="pt-28 pb-16 md:pt-36 md:pb-24">
    <div class="max-w-6xl mx-auto px-5">
      <div class="grid md:grid-cols-2 gap-12 items-center">
        <div class="fade-up">
          <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight mb-6" style="font-family: 'Rubik', Assistant; line-height: 1.15;"
            data-content="hero.title"></h1>

          <p class="text-xl md:text-2xl leading-relaxed mb-6 max-w-2xl hero-subtitle-theme"
            data-content="hero.subtitle"></p>

          <p class="text-lg font-light leading-relaxed mb-8 max-w-lg hero-description-theme"
            data-content="hero.description"></p>

          <div class="flex flex-wrap gap-4">
            <a href="https://wa.me/972547838645" class="cta-primary px-7 py-3 rounded-full text-sm font-medium"
              data-content="hero.cta_primary"></a>
          </div>
        </div>

          <div class="portrait-placeholder w-full h-80vh md:w-40vw md:h-[80vh] rounded-2xl flex flex-col items-center justify-center gap-3 shadow-lg">
             <img
              src="/assets/images/katya-1.jpg"

            />
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ Clients Strip (Marquee) ═══════════ -->
  <section class="py-10 border-y overflow-hidden clients-section-theme">
    <div class="max-w-6xl mx-auto px-5 text-center mb-6">
      <h2 class="text-2xl md:text-3xl font-bold mb-3" style="font-family: 'Rubik', Assistant;" data-content="clients.title"></h2>
      <p class="font-light max-w-3xl mx-auto clients-subtitle-theme" data-content="clients.subtitle"></p>

      <h2 class="text-3xl md:text-4xl font-bold mb-6" style="font-family: 'Rubik', Assistant;"

      <p class="font-light leading-relaxed max-w-3xl mx-auto text-white"
