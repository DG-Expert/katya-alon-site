<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title is updated dynamically from content.yaml -->
  <title>Katya Alon — Marketing Strategy & Content</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- js-yaml must execute before the deferred application script. -->
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="/js/main.js"></script>
  <script defer src="/js/nav.js"></script>
</head>
<body class="h-full w-full overflow-auto page-theme">
  <a href="#main-content" class="site-skip-link">דלגו לתוכן הראשי</a>

  <!-- ═══════════ Header / Navigation ═══════════ -->
  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md border-b site-header-theme">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
      <a href="/" class="site-logo-link" aria-label="Katya Alon home" data-home-link>
        <img
          src="/assets/images/katya-logo-96.webp"
          srcset="/assets/images/katya-logo-96.webp 1x, /assets/images/katya-logo-192.webp 2x"
          alt="Katya Alon Digital Marketing"
          class="site-logo"
          width="500"
          height="500"
        />
      </a>

      <!-- Desktop nav — filled at build time by scripts/build-pages.mjs (siteNav) -->
      <nav id="site-nav-desktop" class="hidden lg:flex items-center gap-4 text-sm font-light nav-text-theme site-primary-nav" aria-label="Primary navigation"></nav>

      <div class="flex items-center gap-4">
        <!-- Language switcher -->
        <div class="flex items-center gap-1 text-sm border rounded-full px-3 py-1.5 lang-switcher-theme">
          <a href="/" class="lang-btn px-2 py-0.5 rounded active" id="btn-he" aria-current="page">HE</a>
          <span class="separator-theme">|</span>
          <a href="/en/" class="lang-btn px-2 py-0.5 rounded" id="btn-en">EN</a>
          <span class="separator-theme">|</span>
          <a href="/ru/" class="lang-btn px-2 py-0.5 rounded" id="btn-ru">RU</a>
        </div>

        <button id="mobile-menu-button" type="button" class="lg:hidden site-menu-button" onclick="toggleMobile()" aria-label="Toggle menu" aria-controls="mobile-nav" aria-expanded="false">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Mobile nav — filled at build time like the desktop nav -->
    <div id="mobile-nav" class="hidden lg:hidden border-t px-5 pb-4 mobile-nav-theme">
      <nav id="site-nav-mobile" class="flex flex-col gap-3 text-sm pt-3 nav-text-theme"></nav>
    </div>
  </header>

  <main id="main-content">
  <!-- ═══════════ Hero Section ═══════════ -->
  <section id="hero" class="pt-28 pb-16 md:pt-36 md:pb-24">
    <div class="max-w-6xl mx-auto px-5">
      <div class="grid md:grid-cols-2 gap-12 items-center">
        <div class="hero-copy">
          <h1 class="hero-title-theme">
            <span class="hero-name" data-content="hero.name"></span>
            <span class="hero-professional-title" data-content="hero.professional_title"></span>
          </h1>

          <p class="text-xl md:text-2xl leading-relaxed mb-6 max-w-2xl hero-subtitle-theme"
            data-content="hero.subtitle"></p>

          <p class="text-lg font-light leading-relaxed mb-8 max-w-lg hero-description-theme"
            data-content="hero.description"></p>

          <div class="flex flex-wrap gap-4">
            <a href="https://wa.me/972547838645" class="cta-primary cta-image-button text-sm font-medium"
              data-content="hero.cta_primary"></a>
          </div>
        </div>

        <div class="flex justify-center">
          <div class="portrait-placeholder w-full rounded-2xl flex flex-col items-center justify-center gap-3 shadow-lg">
             <img
              src="/assets/images/katya-1.webp"
              alt="Katya Alon"
              class="hero-portrait-image w-full h-full object-cover rounded-2xl"
              width="683"
              height="1024"
              fetchpriority="high"
            />
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ Clients Strip (Marquee) ═══════════ -->
  <section class="py-10 border-y overflow-hidden clients-section-theme">
    <div class="max-w-6xl mx-auto px-5 text-center mb-6">
      <h2 class="text-2xl md:text-3xl font-bold mb-3 clients-title-theme" data-content="clients.title"></h2>
      <p class="font-light max-w-3xl mx-auto clients-subtitle-theme" data-content="clients.subtitle"></p>
    </div>
    <!-- Client items rendered dynamically -->
    <div class="relative w-full overflow-hidden clients-marquee">
      <div id="clients-strip"></div>
    </div>
  </section>

  <!-- ═══════════ About Section ═══════════ -->
  <section id="about" class="py-20 md:py-28">
    <div class="max-w-6xl mx-auto px-5">
      <div class="grid md:grid-cols-2 gap-14 items-center">
        <div class="fade-up flex justify-center order-2 md:order-1">
          <div class="portrait-placeholder w-full h-80vh md:w-full md:h-80vh rounded-2xl flex flex-col items-center justify-center gap-3 shadow-md">
              <img
                src="/assets/images/katya-3-720.webp"
                srcset="/assets/images/katya-3-720.webp 720w, /assets/images/katya-3-1440.webp 1440w"
                sizes="(max-width: 767px) calc(100vw - 40px), 556px"
                alt="Katya Alon"
                class="w-full h-full object-cover rounded-2xl"
                width="3360"
                height="5040"
                loading="lazy"
              />
          </div>  
        </div>

        <div class="fade-up order-1 md:order-2">
          <h2 class="text-3xl md:text-4xl font-bold mb-6 about-title-theme"
            data-content="about.title"></h2>
          <!-- About paragraphs rendered dynamically -->
          <div id="about-paragraphs" class="space-y-4"></div>
          <ul id="trust-facts" class="trust-facts" aria-label="Experience"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ Services Section ═══════════ -->
  <section id="services" class="py-20 md:py-28 services-section-theme">
    <div class="max-w-6xl mx-auto px-5">
      <div class="text-center mb-14 fade-up">
        <h2 class="text-3xl md:text-4xl font-bold services-title-theme"
          data-content="services.title"></h2>
      </div>

      <div class="services-diagram-wrap fade-up">
        <div class="services-diagram" id="services-diagram">
          <svg
            class="services-diagram-lines"
            viewBox="0 0 1200 900"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <circle class="services-lines-core" cx="600" cy="450" r="18"></circle>

            <line class="services-lines-path services-line-1" x1="600" y1="450" x2="600" y2="145"></line>
            <line class="services-lines-path services-line-2" x1="600" y1="450" x2="285" y2="355"></line>
            <line class="services-lines-path services-line-3" x1="600" y1="450" x2="915" y2="355"></line>
            <line class="services-lines-path services-line-4" x1="600" y1="450" x2="355" y2="700"></line>
            <line class="services-lines-path services-line-5" x1="600" y1="450" x2="845" y2="700"></line>
          </svg>

          <div class="services-center">
            <div class="services-center-ring">
              <img
                src="/assets/images/katya-1.webp"
                alt="Katya Alon"
                class="services-center-image"
                width="683"
                height="1024"
                loading="lazy"
              />
            </div>
          </div>

          <!-- Service items rendered dynamically -->
          <div id="services-list" class="services-list" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ Service Modal ═══════════ -->
  <div id="service-modal" class="hidden fixed inset-0 z-[100] backdrop-blur-sm flex items-center justify-center p-4 legacy-modal-backdrop-theme">
    <div class="border rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl relative p-6 md:p-8 legacy-modal-panel-theme">
      <button
        type="button"
        onclick="closeServiceModal()"
        class="absolute top-4 left-4 md:top-5 md:left-5 text-2xl leading-none cursor-pointer legacy-modal-close-theme"
        aria-label="Close modal"
      >
        ×
      </button>

      <div class="mb-6">
        <h3 id="modal-title" class="text-2xl md:text-3xl font-bold mb-3 legacy-modal-title-theme"></h3>
        <p id="modal-summary" class="leading-relaxed legacy-modal-summary-theme"></p>
      </div>

      <div class="mb-6">
        <h4 class="text-lg font-semibold mb-3 legacy-modal-heading-theme" data-content="services.includes_title"></h4>
        <ul id="modal-tech-points" class="list-disc pr-5 space-y-2"></ul>
      </div>

      <div class="mb-6">
        <h4 class="text-lg font-semibold mb-3 legacy-modal-heading-theme" data-content="services.results_title"></h4>
        <ul id="modal-second-tech-points" class="list-disc pr-5 space-y-2"></ul>
      </div>

      <div id="modal-body" class="space-y-4 mb-6"></div>

      <div class="mb-6">
        <a
          id="modal-service-link"
          href="#"
          class="cta-secondary cta-image-button text-sm font-medium cursor-pointer"
        ></a>
      </div>

      <div id="modal-video-wrap" class="hidden">
        <h4 id="modal-video-title" class="text-lg font-semibold mb-3 legacy-modal-video-title-theme"></h4>
        <div id="modal-video-frame" class="mb-4"></div>
        <a
          id="modal-video-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="cta-secondary cta-image-button text-sm font-medium cursor-pointer"
        >
          לצפייה בסרטון
        </a>
      </div>
    </div>
  </div>

  <!-- ═══════════ Audience Section ═══════════ -->
  <section class="py-20 md:py-28">
    <div class="max-w-5xl mx-auto px-5">
      <div class="text-center mb-12 fade-up">
        <h2 class="text-3xl md:text-4xl font-bold audience-title-theme"
          data-content="audience.title"></h2>
        <p class="font-light max-w-3xl mx-auto mt-4 audience-subtitle-theme"
          data-content="audience.subtitle"></p>
      </div>
      <!-- Audience cards rendered dynamically -->
      <div id="audience-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 fade-up"></div>
    </div>
  </section>

<!-- ═══════════ Recommendations Section ═══════════ -->
<section class="py-20 md:py-28 why-section-theme">
  <div class="max-w-6xl mx-auto px-5">
    <div class="text-center mb-6 fade-up">
      <h2
        class="text-3xl md:text-4xl font-bold mb-4 why-title-theme"
        data-content="recommendations.title"
      ></h2>
      <p
        class="font-light max-w-3xl mx-auto why-text-theme"
        data-content="recommendations.subtitle"
      ></p>
    </div>

    <div class="relative w-full overflow-hidden recommendations-marquee fade-up">
      <div id="recommendations-strip"></div>
    </div>
  </div>
</section>

<!-- ═══════════ Recommendation Modal ═══════════ -->
<div
  id="recommendation-modal"
  class="hidden fixed inset-0 z-[110] backdrop-blur-sm flex items-center justify-center p-4 recommendation-modal-backdrop-theme"
>
  <div class="recommendation-modal-panel relative">
    <button
      type="button"
      onclick="closeRecommendationModal()"
      class="recommendation-modal-close"
      aria-label="Close recommendation modal"
    >
      ×
    </button>

    <div class="recommendation-modal-image-wrap">
      <img
        id="recommendation-modal-image"
        src=""
        alt=""
        class="recommendation-modal-image"
      />
    </div>
  </div>
</div>

  <!-- ═══════════ Process Section ═══════════ -->
  <section id="process" class="py-20 md:py-28">
    <div class="max-w-6xl mx-auto px-5">
      <div class="text-center mb-14 fade-up">
        <h2 class="text-3xl md:text-4xl font-bold process-title-theme"
          data-content="process.title"></h2>
      </div>
      <!-- Process steps rendered dynamically -->
      <div id="process-list" class="process-flow fade-up"></div>
    </div>
  </section>

  <!-- ═══════════ Trust Section ═══════════ -->
  <section class="py-20 md:py-28 trust-section-theme">
    <div class="max-w-4xl mx-auto px-5 text-center fade-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-6 trust-title-theme"
        data-content="trust.title"></h2>
      <p class="font-light leading-relaxed max-w-3xl mx-auto trust-text-theme"
        data-content="trust.text"></p>
    </div>
  </section>

  <section id="articles" class="py-20 md:py-28 articles-home-section" aria-labelledby="articles-home-title">
    <div class="max-w-6xl mx-auto px-5">
      <div class="text-center mb-12 fade-up">
        <h2 id="articles-home-title" class="text-3xl md:text-4xl font-bold mb-4" data-content="articles_section.title"></h2>
        <p class="font-light max-w-3xl mx-auto" data-content="articles_section.intro"></p>
      </div>
      <div id="home-articles-list" class="articles-card-grid fade-up"></div>
      <p class="articles-all-link-wrap"><a class="cta-secondary cta-image-button" href="/articles/" data-articles-link data-content="articles_section.all_articles"></a></p>
    </div>
  </section>

  <!-- ═══════════ Final CTA Section ═══════════ -->
  <section id="contact" class="py-20 md:py-28">
    <div class="max-w-3xl mx-auto px-5 text-center fade-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-5 final-cta-title-theme"
        data-content="final_cta.title"></h2>
      <p class="font-light mb-10 max-w-xl mx-auto leading-relaxed final-cta-text-theme"
        data-content="final_cta.text"></p>
      <div class="flex flex-wrap justify-center gap-4">
        <a href="https://wa.me/972547838645" class="cta-primary cta-image-button text-sm font-medium"
          data-content="final_cta.cta_primary"></a>
      </div>
    </div>
  </section>

  </main>

  <!-- ═══════════ Footer ═══════════ -->
  <footer class="site-footer footer-theme">
    <div class="max-w-6xl mx-auto px-5">
      <div class="footer-grid">
        <div class="footer-intro"><p class="footer-brand-name">Katya Alon</p><p data-content="footer.summary"></p></div>
        <nav aria-labelledby="footer-nav-title"><h2 id="footer-nav-title" data-content="footer.navigation_label"></h2><ul><li><a href="/" data-home-link data-content="footer.home"></a></li><li><a href="/#about" data-home-anchor="about" data-content="nav.about"></a></li><li><a href="/#process" data-home-anchor="process" data-content="nav.process"></a></li></ul></nav>
        <nav aria-labelledby="footer-services-title"><h2 id="footer-services-title" data-content="footer.services_label"></h2><ul><li><a href="/#services" data-home-anchor="services" data-content="nav.services"></a></li><li><a href="/workshops.html" data-workshops-link data-content="nav.workshops"></a></li><li><a href="/articles/" data-articles-link data-content="footer.articles"></a></li></ul></nav>
        <div aria-labelledby="footer-contact-title"><h2 id="footer-contact-title" data-content="footer.contact_label"></h2><ul><li><a href="https://wa.me/972547838645" data-content="footer.whatsapp"></a></li><li><a href="mailto:katya.shivuk@gmail.com" class="footer-email">katya.shivuk@gmail.com</a></li><li><a href="/workshops.html#registration-privacy" data-workshops-link data-privacy-fragment data-content="footer.privacy_notice"></a></li></ul><div class="footer-social"><a href="https://www.instagram.com/kate_alon_marketing/" target="_blank" rel="noopener noreferrer" class="footer-social-link"><svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg><span class="visually-hidden" data-content="footer.instagram"></span></a><a href="https://www.facebook.com/share/1QT8QYg3Gn/" target="_blank" rel="noopener noreferrer" class="footer-social-link"><svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8.5h2.5V5H14a3.5 3.5 0 0 0-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.4l.6-3.5H14V8.9c0-.2.1-.4.4-.4z" fill="currentColor" stroke="none"/></svg><span class="visually-hidden" data-content="footer.facebook"></span></a></div></div>
      </div>
      <div class="footer-bottom"><p><span class="font-medium">Katya Alon</span> &copy; <span id="footer-year">2026</span></p><p data-content="footer.rights"></p></div>
    </div>
  </footer>
</body>
</html>
