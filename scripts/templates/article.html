<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/articles.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script defer src="/js/articles.js"></script>
</head>
<body class="min-h-full page-theme article-page">
  {{HEADER}}
  <main id="main-content" class="article-main">
    <article class="article-shell article-reading">
      {{BREADCRUMBS}}
      <header class="article-header">
        <h1>{{TITLE}}</h1>
        <p class="article-author">{{AUTHOR}}</p>
      </header>
      <div class="article-body">{{BODY}}</div>
      {{RELATED}}
    </article>
  </main>
  {{FOOTER}}
</body>
</html>
