# Public config only. Secrets (GAS_URL, GAS_HMAC_SECRET, TURNSTILE_SECRET) are set with `wrangler secret put`, never here.
name = "katya-workshop-registration"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://dg-expert.github.io,https://dev-server.tail6972d4.ts.net:8445"
TURNSTILE_HOSTNAMES = "dg-expert.github.io,dev-server.tail6972d4.ts.net"
TURNSTILE_ACTION = "workshop_register"
WORKSHOP_ID = "lawyers-social-2026-11"
# Comma-separated approved consent versions. Empty = every registration is rejected (fail closed).
CONSENT_VERSIONS = "2026-10-v1"

[[ratelimits]]
name = "REGISTRATION_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60
