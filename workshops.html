<!doctype html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Katya Alon">
  <meta property="og:description" content="">
  <title>Katya Alon</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/workshops.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="/js/workshops.js"></script>
</head>
<body class="min-h-full page-theme workshop-page layout-conversion">
  <a href="#workshop-main" class="workshop-skip-link" data-copy="accessibility.skip_to_content"></a>

  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md border-b site-header-theme workshop-header">
    <div class="workshop-shell workshop-header-inner">
      <a id="brand-link" href="/#hero" class="site-logo-link" data-aria-copy="nav.home">
        <img
          id="brand-logo"
          src="/assets/images/katya-logo-96.webp"
          srcset="/assets/images/katya-logo-96.webp 1x, /assets/images/katya-logo-192.webp 2x"
          alt=""
          class="site-logo"
          width="500"
          height="500"
        >
      </a>

      <nav class="hidden lg:flex items-center lg:gap-5 text-sm font-light nav-text-theme" data-aria-copy="nav.navigation_label">
        <a href="/#about" class="nav-link" data-home-anchor="about" data-copy="nav.about"></a>
        <a href="/#services" class="nav-link" data-home-anchor="services" data-copy="nav.services"></a>
        <a href="/#process" class="nav-link" data-home-anchor="process" data-copy="nav.process"></a>
        <a href="/#contact" class="nav-link" data-home-anchor="contact" data-copy="nav.contact"></a>
        <a href="/workshops.html" class="nav-link workshop-nav-active" aria-current="page" data-workshops-link data-copy="nav.workshops"></a>
        <a href="/articles/" class="nav-link" data-articles-link data-site-copy="nav.articles"></a>
      </nav>

      <div class="flex items-center gap-3 sm:gap-4">
        <div class="flex items-center gap-1 text-sm border rounded-full px-2 sm:px-3 py-1.5 lang-switcher-theme" role="group" data-aria-copy="nav.language_label">
          <a href="/workshops.html" class="lang-btn px-2 py-0.5 rounded active" id="btn-he" aria-current="page">HE</a>
          <span class="separator-theme" aria-hidden="true">|</span>
          <a href="/en/workshops.html" class="lang-btn px-2 py-0.5 rounded" id="btn-en">EN</a>
          <span class="separator-theme" aria-hidden="true">|</span>
          <a href="/ru/workshops.html" class="lang-btn px-2 py-0.5 rounded" id="btn-ru">RU</a>
        </div>

        <button
          id="mobile-menu-button"
          type="button"
          class="lg:hidden workshop-menu-button"
          aria-controls="mobile-nav"
          aria-expanded="false"
          data-aria-copy="nav.open_menu"
        >
          <i data-lucide="menu" class="w-5 h-5" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div id="mobile-nav" class="hidden lg:hidden border-t px-5 pb-5 mobile-nav-theme workshop-mobile-nav">
      <nav class="workshop-shell flex flex-col gap-3 text-sm pt-4 nav-text-theme" data-aria-copy="nav.navigation_label">
        <a href="/#about" class="py-1" data-home-anchor="about" data-copy="nav.about"></a>
        <a href="/#services" class="py-1" data-home-anchor="services" data-copy="nav.services"></a>
        <a href="/#process" class="py-1" data-home-anchor="process" data-copy="nav.process"></a>
        <a href="/#contact" class="py-1" data-home-anchor="contact" data-copy="nav.contact"></a>
        <a href="/workshops.html" class="py-1 workshop-nav-active" aria-current="page" data-workshops-link data-copy="nav.workshops"></a>
        <a href="/articles/" class="py-1" data-articles-link data-site-copy="nav.articles"></a>
      </nav>
    </div>
  </header>

  <main id="workshop-main" tabindex="-1">
    <div id="content-error" class="workshop-load-error" role="alert" hidden></div>

    <section class="workshop-hero" aria-labelledby="workshop-title">
      <div class="workshop-orb workshop-orb-one" aria-hidden="true"></div>
      <div class="workshop-orb workshop-orb-two" aria-hidden="true"></div>
      <div class="workshop-shell hero-frame">
        <div class="hero-grid">
          <div class="hero-copy">
            <div class="hero-meta-line">
              <p id="layout-label" class="layout-label"></p>
              <span aria-hidden="true"></span>
              <p id="hero-eyebrow" class="hero-eyebrow"></p>
            </div>
            <h1 id="workshop-title" class="workshop-title"></h1>
            <p id="hero-subtitle" class="hero-subtitle"></p>
            <p id="hero-description" class="hero-description"></p>
          </div>

          <aside class="hero-details" aria-labelledby="details-heading">
            <p id="details-kicker" class="details-kicker"></p>
            <h2 id="details-heading" class="details-heading"></h2>
            <dl id="hero-details-list" class="hero-details-list"></dl>
          </aside>
        </div>
      </div>
    </section>

    <div class="workshop-content-flow">
      <section id="content-1" class="workshop-section content-section content-section-one" aria-labelledby="content-1-title">
        <div class="workshop-shell section-panel section-grid" data-reveal>
          <header class="section-heading">
            <p id="content-1-kicker" class="section-kicker"></p>
            <h2 id="content-1-title" class="section-title"></h2>
          </header>
          <div id="content-1-paragraphs" class="section-prose"></div>
        </div>
      </section>

      <div id="cta-1-wrap" class="workshop-cta-row workshop-shell" data-reveal>
        <a id="cta-1" href="#registration" class="cta-primary cta-image-button workshop-cta"></a>
      </div>

      <section id="content-2" class="workshop-section content-section content-section-two" aria-labelledby="content-2-title">
        <div class="workshop-shell" data-reveal>
          <header class="section-heading section-heading-wide">
            <p id="content-2-kicker" class="section-kicker"></p>
            <h2 id="content-2-title" class="section-title"></h2>
            <p id="content-2-intro" class="section-intro"></p>
          </header>
          <ol id="content-2-items" class="workshop-items"></ol>
        </div>
      </section>

      <figure id="power-image-wrap" class="workshop-power-image workshop-shell" data-reveal>
        <div class="power-image-frame">
          <img id="power-image" alt="" width="3360" height="5040" loading="lazy" decoding="async">
          <span class="power-image-accent" aria-hidden="true"></span>
        </div>
        <figcaption id="power-image-caption" class="power-image-caption"></figcaption>
      </figure>

      <div id="cta-2-wrap" class="workshop-cta-row workshop-shell" data-reveal>
        <a id="cta-2" href="#registration" class="cta-primary cta-image-button workshop-cta"></a>
      </div>

      <section id="content-3" class="workshop-section content-section content-section-three" aria-labelledby="content-3-title">
        <div class="workshop-shell" data-reveal>
          <header class="section-heading section-heading-wide">
            <p id="content-3-kicker" class="section-kicker"></p>
            <h2 id="content-3-title" class="section-title"></h2>
            <p id="content-3-intro" class="section-intro"></p>
          </header>
          <dl id="content-3-items" class="workshop-faq"></dl>
        </div>
      </section>

      <section id="pricing" class="workshop-section pricing-section" aria-labelledby="pricing-title">
        <div class="workshop-shell pricing-panel" data-reveal>
          <div><p id="pricing-kicker" class="section-kicker"></p><h2 id="pricing-title" class="section-title"></h2><p id="pricing-intro" class="section-intro"></p></div>
          <div class="price-stack"><p id="pricing-original" class="price-original"></p><p id="pricing-current" class="price-current"></p><p id="pricing-breakdown" class="price-breakdown"></p><p id="pricing-deadline" class="price-deadline"></p><p id="pricing-after" class="price-after"></p><a id="pricing-cta" href="#registration" class="cta-primary cta-image-button workshop-cta"></a></div>
        </div>
      </section>

      <section id="instructor" class="workshop-section instructor-section" aria-labelledby="instructor-title">
        <div class="workshop-shell instructor-panel" data-reveal>
          <figure class="instructor-media">
            <div class="instructor-image-frame"><img id="instructor-image" alt="" width="1312" height="1199" loading="lazy" decoding="async"></div>
            <figcaption id="instructor-caption" class="instructor-caption"></figcaption>
          </figure>
          <div><p id="instructor-kicker" class="section-kicker"></p><h2 id="instructor-title" class="section-title"></h2><div id="instructor-bio" class="section-prose"></div></div>
        </div>
      </section>
    </div>

    <section id="registration" class="registration-section" aria-labelledby="registration-title">
      <div class="workshop-shell registration-shell" data-reveal>
        <div class="registration-copy">
          <p id="form-kicker" class="section-kicker"></p>
          <h2 id="registration-title" class="registration-title"></h2>
          <p id="form-intro" class="registration-intro"></p>
          <div class="demo-notice" role="note">
            <i data-lucide="info" aria-hidden="true"></i>
            <p id="form-demo-notice"></p>
          </div>
        </div>

        <form id="registration-form" class="registration-form" novalidate>
          <div class="registration-honeypot" aria-hidden="true">
            <label for="registration-website">Website</label>
            <input id="registration-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label id="full-name-label" for="full_name"></label>
              <input
                id="full_name"
                name="full_name"
                type="text"
                required
                minlength="2"
                maxlength="100"
                autocomplete="name"
                aria-describedby="full-name-help full-name-error"
                aria-invalid="false"
              >
              <p id="full-name-help" class="field-help"></p>
              <p id="full-name-error" class="field-error" aria-live="polite" hidden></p>
            </div>

            <div class="form-field">
              <label id="mobile-label" for="mobile"></label>
              <input
                id="mobile"
                name="mobile"
                type="tel"
                inputmode="numeric"
                required
                minlength="8"
                pattern="[0-9]{8,15}"
                autocomplete="tel"
                aria-describedby="mobile-help mobile-error"
                aria-invalid="false"
              >
              <p id="mobile-help" class="field-help"></p>
              <p id="mobile-error" class="field-error" aria-live="polite" hidden></p>
            </div>

            <div class="form-field">
              <label id="email-label" for="email"></label>
              <input
                id="email"
                name="email"
                type="email"
                required
                maxlength="254"
                autocomplete="email"
                aria-describedby="email-help email-error"
                aria-invalid="false"
              >
              <p id="email-help" class="field-help"></p>
              <p id="email-error" class="field-error" aria-live="polite" hidden></p>
            </div>

            <div class="form-field">
              <label id="expertise-label" for="expertise"></label>
              <input
                id="expertise"
                name="expertise"
                type="text"
                required
                minlength="2"
                maxlength="160"
                autocomplete="off"
                aria-describedby="expertise-help expertise-error"
                aria-invalid="false"
              >
              <p id="expertise-help" class="field-help"></p>
              <p id="expertise-error" class="field-error" aria-live="polite" hidden></p>
            </div>
          </div>

          <div id="registration-privacy">
            <p id="form-privacy-note" class="form-privacy-note"></p>
            <p id="form-privacy-placeholder" class="form-privacy-placeholder"></p>
          </div>
          <label id="form-consent-wrap" class="form-consent" hidden>
            <input id="form-consent" name="consent" type="checkbox" disabled>
            <span id="form-consent-label"></span>
          </label>
          <div id="turnstile-widget" class="turnstile-widget" hidden></div>
          <button id="form-submit" type="submit" class="cta-primary cta-image-button workshop-submit" disabled></button>
          <p id="form-status" class="form-status" role="status" aria-live="assertive" aria-atomic="true"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer footer-theme workshop-footer">
    <div class="workshop-shell">
      <div class="footer-grid">
        <div class="footer-intro"><p class="footer-brand-name">Katya Alon</p><p data-site-copy="footer.summary"></p></div>
        <nav data-site-aria="footer.navigation_label" aria-labelledby="workshop-footer-nav"><h2 id="workshop-footer-nav" data-site-copy="footer.navigation_label"></h2><ul><li><a href="/" data-home-link data-site-copy="footer.home"></a></li><li><a href="/#about" data-home-anchor="about" data-site-copy="nav.about"></a></li><li><a href="/#process" data-home-anchor="process" data-site-copy="nav.process"></a></li></ul></nav>
        <nav aria-labelledby="workshop-footer-services"><h2 id="workshop-footer-services" data-site-copy="footer.services_label"></h2><ul><li><a href="/#services" data-home-anchor="services" data-site-copy="nav.services"></a></li><li><a href="/workshops.html" data-workshops-link data-site-copy="nav.workshops"></a></li><li><a href="/articles/" data-articles-link data-site-copy="nav.articles"></a></li></ul></nav>
        <div aria-labelledby="workshop-footer-contact"><h2 id="workshop-footer-contact" data-site-copy="footer.contact_label"></h2><ul><li><a href="https://wa.me/972547838645" data-site-copy="footer.whatsapp"></a></li><li><a href="mailto:katya.shivuk@gmail.com"><span data-site-copy="footer.email"></span>: katya.shivuk@gmail.com</a></li><li><a href="#registration-privacy" data-site-copy="footer.privacy_notice"></a></li></ul></div>
      </div>
      <div class="footer-bottom"><p><span class="font-medium">Katya Alon</span> &copy; <span id="footer-year"></span></p><p data-site-copy="footer.rights"></p></div>
    </div>
  </footer>
</body>
</html>
